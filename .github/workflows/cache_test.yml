name: Cache test
on:
  workflow_dispatch:
  push:
    # Pattern matched against refs/tags
    tags:
      - '**'           # Push events to every tag

jobs:
  build:
    runs-on: ubuntu-22.04
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: check free space
      run: |
        df -h
        pwd
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout GUI
      uses: actions/checkout@v4
      with:
        submodules: true
        path: x6100_gui

    - name: Checkout buildroot
      uses: actions/checkout@v4
      with:
        submodules: true
        repository: gdyuldin/AetherX6100Buildroot
        path: AetherX6100Buildroot

    - name: Patch GUI mk
      run: |
        sed -i "s,https://github.com/gdyuldin/x6100_gui,${GITHUB_WORKSPACE}/x6100_gui,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_SITE_METHOD = git,X6100_GUI_SITE_METHOD = local,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_GIT_SUBMODULES,# X6100_GUI_GIT_SUBMODULES,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk

    # Configure
    - name: Configure
      run: |
        cd AetherX6100Buildroot && bash ./br_config.sh

    # Ccache
    # - name: Ccache cache files
    #   uses: actions/cache@v4
    #   with:
    #     path: ~/.buildroot-ccache
    #     key: ${{ runner.os }}-ccache-${{ github.sha }}
    #     restore-keys: |
    #       Linux-ccache-${{ github.sha }}
    #       Linux-ccache-
    #       ${{ runner.os }}-ccache-

    - name: Restore Buildroot Cache
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: ./AetherX6100Buildroot/buildroot-cache.tar.zst
        key: buildroot-cache-${{ github.sha }}
        restore-keys: |
          buildroot-cache-

    - name: Unpack Cache
      if: steps.cache-restore.outputs.cache-hit == 'true'
      run: |
        cd AetherX6100Buildroot
        echo "Unpack cached host and ccache..."
        tar --zstd -xf buildroot-cache.tar.zst
        mkdir -p ~/.buildroot-ccache
        mv ccache-dir/* ~/.buildroot-ccache/ || true

    # Build
    - name: Build
      run: |
        cd AetherX6100Buildroot/build
        build/host/bin/ccache -M 7G  # Limit cache
        make lame
        make mpg123
        make libsndfile-dirclean
        make

    # Replace U-boot
    - name: Replace u-boot
      run: |
        dd if=x6100_gui/u-boot/u-boot-sunxi-with-spl.bin of=AetherX6100Buildroot/build/images/sdcard.img seek=8K bs=1 conv=notrunc

    # Compress image
    - name: Compress image
      run: |
        cd AetherX6100Buildroot/build/images
        mv sdcard.img sdcard.${{ github.ref_name }}.img
        zip sdcard.${{ github.ref_name }}.img.zip sdcard.${{ github.ref_name }}.img

    # Upload image
    # - name: 'Upload image'
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: sdcard.${{ github.ref_name }}.img
    #     path: AetherX6100Buildroot/build/images/sdcard.${{ github.ref_name }}.img

    # Create release
    # - name: Release
    #   uses: softprops/action-gh-release@v2
    #   if: startsWith(github.ref, 'refs/tags/')
    #   with:
    #     files: AetherX6100Buildroot/build/images/sdcard.${{ github.ref_name }}.img.zip


    - name: Prune Cache
      run: |
        cd AetherX6100Buildroot
        # Get stat
        build/host/bin/ccache -s
        # Prune
        build/host/bin/ccache -c



    - name: Pack and Save Cache back to Main
      if: always()
      run: |
        cd AetherX6100Buildroot
        echo "Prepare cache..."
        mkdir -p ccache-dir
        cp -r ~/.buildroot-ccache/* ccache-dir/ || true

        # Compress ccache and build/host
        tar --zstd -cf buildroot-cache.tar.zst build/host ccache-dir

        # Upload archive
        gh extension install actions/gh-actions-cache || true
        CACHE_KEY="buildroot-cache-${{ github.sha }}"

        echo "Saving compressed cache to main: $CACHE_KEY"
        gh actions-cache create ./buildroot-cache.tar.zst \
          --key "$CACHE_KEY" \
          --branch "main"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
